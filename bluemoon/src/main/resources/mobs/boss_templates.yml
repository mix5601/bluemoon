# 보스 양식 (템플릿)
#
# 몹에 "Template: 양식이름" 을 적으면 아래 양식의 설정을 그대로 물려받습니다.
#   - 숫자/문자 값은 몹 쪽 값이 덮어씁니다 (Health, Display ...)
#   - Options, BossBar 같은 섹션은 키 단위로 합쳐집니다 (BossBar.Range 만 바꾸기 등)
#   - Skills, Drops 목록은 양식 뒤에 몹의 목록이 이어 붙습니다
#   - 여러 개 상속: "Template: Boss,Undead" (뒤에 적은 것이 우선)
#   - Abstract: true 인 양식은 /bm spawn 으로 소환되지 않고 상속 전용으로만 쓰입니다
#
# 각 양식은 모델/공격 패턴 없이 "등급별 공통 규칙"만 정합니다.
# 실제 보스는 example_bosses.yml 처럼 Type, Display, Model, 고유 스킬만 적으면 됩니다.
#
# 페이즈 스킬(boss_skills.yml)은 Cooldown: 9999 로 한 번만 발동합니다.
#
# ═════════════════════════════════════════════════════════════════════════════
# 등급 규격
# ═════════════════════════════════════════════════════════════════════════════
# | 항목          | MiniBoss 미니 보스 | MidBoss 중간 보스  | Boss 보스             | FieldBoss 필드 보스       |
# | 등장 위치     | 사냥터/던전 방     | 던전 중간 관문     | 던전 마지막 방        | 열린 필드 (여러 명)       |
# | 체력          | 150                | 400                | 1500                  | 6000                      |
# | 페이즈 수     | 1                  | 2 (50%)            | 3 (66% / 33%)         | 3 (50% / 20% 광폭화)      |
# | 고유 스킬 수  | 2                  | 4                  | 6                     | 6                         |
# |  - 1페이즈    | 2 (기본기, 견제기) | 3 (+광역기)        | 3 (+광역기)           | 3 (+광역기)               |
# |  - 2페이즈    | -                  | +1 (강화기)        | +2 (기믹 2)           | +2                        |
# |  - 3페이즈    | -                  | -                  | +1 (필살기)           | +1 (필살기)               |
# | 쿨타임(초)    | 4 ~ 6              | 4 ~ 8              | 4 ~ 15                | 4 ~ 20                    |
# | 보스바        | 초록, 1칸, 16블록  | 노랑, 6칸, 32블록  | 빨강, 10칸, 48블록    | 보라, 20칸, 96블록, 안개  |
# | 알림 범위     | 주변 16블록 액션바 | 주변 32블록        | 주변 48블록 타이틀    | 월드 전체                 |
# | 전환 무적     | -                  | -                  | 등장 2초, 전환 2초    | 등장 3초, 전환 2초        |
# | 전투 이탈 시  | -                  | -                  | -                     | 체력 회복                 |
# | 기본 보상     | exp 40             | exp 80             | exp 300               | exp 1000                  |
#
# 스킬 역할
#   기본기  근접 주력기. 가장 자주 쓰는 공격 (쿨 4~6초)
#   견제기  원거리 공격. 거리를 벌린 플레이어를 노림
#   광역기  주변 전체를 치는 공격. 뭉쳐 있으면 위험
#   강화기  중간 보스 2페이즈에 추가되는 돌진/연속기
#   기믹    보스 2페이즈부터: 소환, 장판, 투사체 세례 등 공략이 필요한 패턴
#   필살기  마지막 페이즈 전용 큰 패턴. 반드시 예고(메시지/파티클) 후 발동
#
# 고유 스킬 수 = 몹의 Skills 중 ~onTimer 로 도는 공격 패턴 수 (양식이 넣어 주는 연출 스킬 제외)
# 페이즈 구분 = 스킬 라인의 ?healthpercent{max=..} 값 (페이즈 경계와 같은 값을 씁니다)
#
# 작성 양식 (복사해서 이름/스킬만 바꿔 쓰세요)
#
#   이름:
#     Template: Boss              # MiniBoss / MidBoss / Boss / FieldBoss
#     Type: ZOMBIE
#     Display: '&c이름'
#     Model:
#       Id: 모델
#     Skills:
#     # ── 1페이즈 (모든 등급) ──
#     - skill{s=기본기} @target ~onTimer:80
#     - skill{s=견제기} @target ~onTimer:60                                  # 미니 보스는 여기까지
#     - skill{s=광역기} @self ~onTimer:140
#     # ── 2페이즈 ── 중간 보스 0.5 / 보스 0.66 / 필드 보스 0.5
#     - skill{s=강화기} @target ~onTimer:120 ?healthpercent{max=0.5}         # 중간 보스는 여기까지
#     - skill{s=기믹1} @target ~onTimer:160 ?healthpercent{max=0.66}         # 보스: 강화기 대신 기믹 2개
#     - skill{s=기믹2} @self ~onTimer:300 ?healthpercent{max=0.66}
#     # ── 3페이즈 ── 보스 0.33 / 필드 보스 0.2
#     - skill{s=필살기} @self ~onTimer:400 ?healthpercent{max=0.33}

# ─────────────────────────────────────────────
# 미니 보스: 사냥터나 던전 방 하나를 지키는 엘리트 몹. 페이즈 없음
# ─────────────────────────────────────────────
MiniBoss:
  Abstract: true
  Health: 150
  Damage: 7
  Armor: 4
  KnockbackResistance: 0.4
  FollowRange: 24
  BossBar:
    Title: '&a<caster.name>'
    Color: GREEN
    Style: SOLID
    Range: 16
  Options:
    Despawn: false
    PreventSunburn: true
    PreventOtherDrops: true
    ShowNameplate: false
  Drops:
  - exp 40
  Skills:
  - skill{s=MiniBoss_Appear} @self ~onSpawn
  - skill{s=MiniBoss_Defeated} @self ~onDeath

# ─────────────────────────────────────────────
# 중간 보스: 던전 중간/구역 끝에서 길을 막는 강한 몹. 2페이즈 (100~50%, 50~0%)
# ─────────────────────────────────────────────
MidBoss:
  Abstract: true
  Health: 400
  Damage: 10
  Armor: 6
  KnockbackResistance: 0.6
  FollowRange: 32
  BossBar:
    Title: '&e&l<caster.name>'
    Color: YELLOW
    Style: SEGMENTED_6
    Range: 32
  Options:
    Despawn: false
    PreventSunburn: true
    PreventOtherDrops: true
    ShowNameplate: false
  Drops:
  - exp 80
  Skills:
  - skill{s=MidBoss_Appear} @self ~onSpawn
  - skill{s=MidBoss_Enrage} @self ~onDamaged ?healthpercent{max=0.5}
  - skill{s=MidBoss_Defeated} @self ~onDeath

# ─────────────────────────────────────────────
# 보스: 던전 마지막 방의 주인. 3페이즈 (100~66%, 66~33%, 33~0%)
# ─────────────────────────────────────────────
Boss:
  Abstract: true
  Health: 1500
  Damage: 14
  Armor: 10
  KnockbackResistance: 1.0
  FollowRange: 40
  BossBar:
    Title: '&c&l<caster.name>'
    Color: RED
    Style: SEGMENTED_10
    Range: 48
    DarkenSky: true
    PlayMusic: true
  Options:
    Despawn: false
    PreventSunburn: true
    PreventOtherDrops: true
    ShowNameplate: false
  Drops:
  - exp 300
  Skills:
  - skill{s=Boss_Intro} @self ~onSpawn
  - skill{s=Boss_Phase2} @self ~onDamaged ?healthpercent{max=0.66}
  - skill{s=Boss_Phase3} @self ~onDamaged ?healthpercent{max=0.33}
  - skill{s=Boss_Defeated} @self ~onDeath

# ─────────────────────────────────────────────
# 필드 보스: 열린 필드에 나타나 여러 명이 함께 잡는 월드 보스. 3페이즈 (100~50%, 50~20%, 20~0%)
# 등장/처치가 월드 전체에 알려지고, 싸우는 사람이 없으면 체력을 회복합니다.
# ─────────────────────────────────────────────
FieldBoss:
  Abstract: true
  Health: 6000
  Damage: 18
  Armor: 14
  KnockbackResistance: 1.0
  FollowRange: 48
  BossBar:
    Title: '&5&l[필드 보스] &d<caster.name>'
    Color: PURPLE
    Style: SEGMENTED_20
    Range: 96
    CreateFog: true
  Options:
    Despawn: false
    PreventSunburn: true
    PreventOtherDrops: true
    ShowNameplate: true
  Drops:
  - exp 1000
  Skills:
  - skill{s=FieldBoss_Announce} @self ~onSpawn
  - skill{s=FieldBoss_Phase2} @self ~onDamaged ?healthpercent{max=0.5}
  - skill{s=FieldBoss_Berserk} @self ~onDamaged ?healthpercent{max=0.2}
  - skill{s=FieldBoss_Regen} @self ~onTimer:40 ?!hastarget ?healthpercent{max=0.999}
  - skill{s=FieldBoss_Defeated} @self ~onDeath
