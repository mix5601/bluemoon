# 보스 양식 (템플릿)
#
# 몹에 "Template: 양식이름" 을 적으면 아래 양식의 설정을 그대로 물려받습니다.
#   - 숫자/문자 값은 몹 쪽 값이 덮어씁니다 (Health, Display ...)
#   - Options, BossBar 같은 섹션은 키 단위로 합쳐집니다 (BossBar.Range 만 바꾸기 등)
#   - Skills, Drops 목록은 양식 뒤에 몹의 목록이 이어 붙습니다
#   - 여러 개 상속: "Template: Boss,Undead" (뒤에 적은 것이 우선)
#   - Abstract: true 인 양식은 /bm spawn 으로 소환되지 않고 상속 전용으로만 쓰입니다
#
# 각 양식은 모델/공격 패턴 없이 "등급별 공통 규칙"만 정합니다.
# 실제 보스는 example_bosses.yml 처럼 Type, Display, Model, 고유 스킬만 적으면 됩니다.
#
# 페이즈 스킬(boss_skills.yml)은 Cooldown: 9999 로 한 번만 발동합니다.
#
# 등급 비교
# | 항목          | MidBoss (중간 보스) | Boss (보스)          | FieldBoss (필드 보스)      |
# | 체력          | 400                 | 1500                 | 6000                       |
# | 보스바        | 노랑, 6칸, 32블록   | 빨강, 10칸, 48블록   | 보라, 20칸, 96블록, 안개   |
# | 페이즈        | 50% 흥분            | 66% / 33%            | 50% / 20%                  |
# | 알림 범위     | 주변 32블록         | 주변 48블록          | 월드 전체                  |
# | 전투 이탈 시  | -                   | -                    | 체력 회복                  |

# ─────────────────────────────────────────────
# 중간 보스: 던전 중간/구역 끝에서 길을 막는 강한 몹
# ─────────────────────────────────────────────
MidBoss:
  Abstract: true
  Health: 400
  Damage: 10
  Armor: 6
  KnockbackResistance: 0.6
  FollowRange: 32
  BossBar:
    Title: '&e&l<caster.name>'
    Color: YELLOW
    Style: SEGMENTED_6
    Range: 32
  Options:
    Despawn: false
    PreventSunburn: true
    PreventOtherDrops: true
    ShowNameplate: false
  Drops:
  - exp 80
  Skills:
  - skill{s=MidBoss_Appear} @self ~onSpawn
  - skill{s=MidBoss_Enrage} @self ~onDamaged ?healthpercent{max=0.5}
  - skill{s=MidBoss_Defeated} @self ~onDeath

# ─────────────────────────────────────────────
# 보스: 던전 마지막 방의 주인. 3페이즈 (100~66%, 66~33%, 33~0%)
# ─────────────────────────────────────────────
Boss:
  Abstract: true
  Health: 1500
  Damage: 14
  Armor: 10
  KnockbackResistance: 1.0
  FollowRange: 40
  BossBar:
    Title: '&c&l<caster.name>'
    Color: RED
    Style: SEGMENTED_10
    Range: 48
    DarkenSky: true
    PlayMusic: true
  Options:
    Despawn: false
    PreventSunburn: true
    PreventOtherDrops: true
    ShowNameplate: false
  Drops:
  - exp 300
  Skills:
  - skill{s=Boss_Intro} @self ~onSpawn
  - skill{s=Boss_Phase2} @self ~onDamaged ?healthpercent{max=0.66}
  - skill{s=Boss_Phase3} @self ~onDamaged ?healthpercent{max=0.33}
  - skill{s=Boss_Defeated} @self ~onDeath

# ─────────────────────────────────────────────
# 필드 보스: 열린 필드에 나타나 여러 명이 함께 잡는 월드 보스
# 등장/처치가 월드 전체에 알려지고, 싸우는 사람이 없으면 체력을 회복합니다.
# ─────────────────────────────────────────────
FieldBoss:
  Abstract: true
  Health: 6000
  Damage: 18
  Armor: 14
  KnockbackResistance: 1.0
  FollowRange: 48
  BossBar:
    Title: '&5&l[필드 보스] &d<caster.name>'
    Color: PURPLE
    Style: SEGMENTED_20
    Range: 96
    CreateFog: true
  Options:
    Despawn: false
    PreventSunburn: true
    PreventOtherDrops: true
    ShowNameplate: true
  Drops:
  - exp 1000
  Skills:
  - skill{s=FieldBoss_Announce} @self ~onSpawn
  - skill{s=FieldBoss_Phase2} @self ~onDamaged ?healthpercent{max=0.5}
  - skill{s=FieldBoss_Berserk} @self ~onDamaged ?healthpercent{max=0.2}
  - skill{s=FieldBoss_Regen} @self ~onTimer:40 ?!hastarget ?healthpercent{max=0.999}
  - skill{s=FieldBoss_Defeated} @self ~onDeath
