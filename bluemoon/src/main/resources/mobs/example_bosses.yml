# 보스 양식(boss_templates.yml) 사용 예시
# Template 으로 등급별 공통 설정(체력, 보스바, 페이즈, 알림, 보상)을 물려받고
# 여기에는 생김새와 고유 스킬만 적습니다. 물려받은 값도 다시 적으면 덮어씁니다.
# 고유 스킬 수와 페이즈 배치는 boss_templates.yml 의 "등급 규격"을 따릅니다.
#
# /bm spawn GolemSentry    (미니 보스)  1페이즈, 스킬 2
# /bm spawn GolemCaptain   (중간 보스)  2페이즈, 스킬 3 + 1
# /bm spawn GolemKing      (보스)       3페이즈, 스킬 3 + 2 + 1
# /bm spawn AncientGolem   (필드 보스)  3페이즈, 스킬 3 + 2 + 1

GolemSentry:
  Template: MiniBoss
  Type: ZOMBIE
  Display: '&a골렘 파수꾼'
  MovementSpeed: 0.23
  HitboxScale: 1.2
  Model:
    Id: golem
    Scale: 1.2
  Options:
    Silent: true
  Drops:
  - iron_ingot 1-3
  Skills:
  - skill{s=GolemSlam} @target ~onTimer:100 ?~distance{max=5}
  - skill{s=GolemRock} @target ~onTimer:80 ?~distance{min=6;max=20}

GolemCaptain:
  Template: MidBoss
  Type: ZOMBIE
  Display: '&e골렘 대장'
  MovementSpeed: 0.24
  HitboxScale: 1.4
  Model:
    Id: golem
    Scale: 1.4
  Options:
    Silent: true
  Drops:
  - iron_ingot 3-6
  - gold_ingot 1-2 0.5
  Skills:
  # 1페이즈
  - skill{s=GolemSlam} @target ~onTimer:100 ?~distance{max=5}
  - skill{s=GolemRock} @target ~onTimer:70 ?~distance{min=6;max=24}
  - skill{s=GolemStomp} @self ~onTimer:160 ?hastarget
  # 2페이즈 (50%)
  - skill{s=GolemCharge} @target ~onTimer:120 ?healthpercent{max=0.5} ?~distance{min=4;max=16}

GolemKing:
  Template: Boss
  Type: ZOMBIE
  Display: '&c골렘 왕'
  MovementSpeed: 0.25
  HitboxScale: 2.0
  Model:
    Id: golem
    Scale: 2.0
  Options:
    Silent: true
  Drops:
  - iron_block 2-4
  - diamond 1-3
  - golden_apple 1 0.5
  Skills:
  # 1페이즈
  - skill{s=GolemSlam} @target ~onTimer:80 ?~distance{max=6}
  - skill{s=GolemRock} @target ~onTimer:60 ?~distance{min=6;max=32}
  - skill{s=GolemStomp} @self ~onTimer:140 ?hastarget
  # 2페이즈 (66%): 돌 세례, 부하 골렘 소환
  - skill{s=GolemKing_RockRain} @target ~onTimer:160 ?healthpercent{max=0.66}
  - skill{s=GolemKing_CallGuards} @self ~onTimer:300 ?healthpercent{max=0.66}
  # 3페이즈 (33%): 필살기
  - skill{s=GolemKing_Cataclysm} @self ~onTimer:400 ?healthpercent{max=0.33} ?hastarget

AncientGolem:
  Template: FieldBoss
  Type: ZOMBIE
  Display: '&5고대 골렘'
  MovementSpeed: 0.22
  HitboxScale: 3.0
  Model:
    Id: golem
    Scale: 3.0
  Options:
    Silent: true
  Drops:
  - netherite_scrap 1-3
  - diamond_block 1-2
  - enchanted_golden_apple 1 0.3
  Skills:
  # 1페이즈
  - skill{s=GolemSlam} @target ~onTimer:80 ?~distance{max=8}
  - skill{s=GolemStomp} @self ~onTimer:120 ?hastarget
  - skill{s=GolemKing_RockRain} @target ~onTimer:100
  # 2페이즈 (50%)
  - skill{s=GolemCharge} @target ~onTimer:140 ?healthpercent{max=0.5} ?~distance{min=4;max=20}
  - skill{s=GolemKing_CallGuards} @self ~onTimer:400 ?healthpercent{max=0.5}
  # 3페이즈 (20% 광폭화): 필살기
  - skill{s=GolemKing_Cataclysm} @self ~onTimer:300 ?healthpercent{max=0.2} ?hastarget
